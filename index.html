<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wormageddon in Space</title>
  <!-- Arcade fonts: Press Start 2P (titles, HUD, buttons) and VT323 (text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Between-waves menu (shown by main.js) -->
  <div id="wave-menu" class="menu" hidden>
    <div class="panel">
      <h1 id="wave-menu-title">Wave 1 complete</h1>
      <p id="wave-menu-stats"></p>
      <div class="wallet"><span class="coin"></span> <span id="wallet-amount">0</span> coins</div>
      <div id="upgrade-list" class="upgrades"></div>
      <button id="continue-btn" class="continue" type="button">Continue</button>
      <p class="hint">Buy with a click or keys 1–7 · Enter to continue</p>
    </div>
  </div>
  <!-- Game over: enter names, then the highscore list (shown by main.js) -->
  <div id="score-menu" class="menu" hidden>
    <div class="panel">
      <h1>Game over</h1>
      <p id="score-summary"></p>

      <form id="name-form" autocomplete="off">
        <p class="hint-top">Enter your names for the highscore list</p>
        <div class="names">
          <label class="p1">P1<input id="name-p1" maxlength="3" spellcheck="false" autocapitalize="characters" placeholder="AAA"></label>
          <span class="amp">&amp;</span>
          <label class="p2">P2<input id="name-p2" maxlength="3" spellcheck="false" autocapitalize="characters" placeholder="BBB"></label>
        </div>
        <button id="save-score-btn" class="continue" type="submit">Save</button>
        <button id="skip-score-btn" class="link" type="button">Skip</button>
      </form>

      <div id="score-list-view" hidden>
        <h2>Highscores</h2>
        <ol id="score-list" class="scores"></ol>
        <p id="score-note" class="hint"></p>
        <button id="play-again-btn" class="continue" type="button">Play again</button>
        <p class="hint">or press Enter</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
